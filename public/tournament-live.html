<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Top Score — Autumn Festival Tournament</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding: 40px; }
    .tl-wrap { max-width: 1100px; margin: 0 auto; }
    .tl-wrap h1 { text-align: center; font-size: 32px; }
    .tl-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    @media (min-width: 800px) {
      .tl-grid { grid-template-columns: 1fr 1fr; }
    }
    .tl-card { position: relative; overflow: hidden; }
    .tl-card h2 { text-align: center; margin-top: 0; }
    .tl-card .tl-status { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 4px; }
    .tl-card .leaderboard-list li { font-size: 18px; padding: 10px 6px; }
    .tl-card .leaderboard-list .rank { width: 34px; font-size: 20px; }
    .tl-card .tl-avatar { width: 32px; height: 32px; font-size: 16px; flex-shrink: 0; }
    .tl-reveal-row { text-align: center; margin-bottom: 14px; }
    .tl-reveal-row button { font-size: 13px; padding: 8px 16px; }
    .tl-name-hidden { color: var(--muted); letter-spacing: 2px; font-style: italic; }
    .tl-name-reveal { animation: tl-reveal-pop 0.4s ease; }
    @keyframes tl-reveal-pop {
      from { opacity: 0; transform: scale(0.8) translateX(-6px); }
      to { opacity: 1; transform: scale(1) translateX(0); }
    }

    /* Top-3 podium, filled in as the reveal reaches ranks 3/2/1 */
    .tl-podium {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 20px;
      padding-top: 10px;
    }
    .tl-podium-slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 30%;
      opacity: 0;
      transform: scale(0.6) translateY(20px);
      transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.3), transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.3);
    }
    .tl-podium-slot.filled { opacity: 1; transform: scale(1) translateY(0); }
    .tl-podium-medal {
      font-size: 30px;
      line-height: 1;
      margin-bottom: 2px;
      filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.8));
      animation: tl-medal-bounce 1.4s ease-in-out infinite;
    }
    .tl-podium-1 .tl-podium-medal { font-size: 38px; }
    @keyframes tl-medal-bounce {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-6px) rotate(6deg); }
    }
    .tl-podium-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      color: #12151c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 6px;
      border: 3px solid transparent;
    }
    .tl-podium-1 .tl-podium-avatar {
      width: 72px;
      height: 72px;
      font-size: 26px;
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25), 0 0 24px 4px rgba(255, 209, 102, 0.65);
      animation: tl-glow-gold 1.6s ease-in-out infinite;
    }
    .tl-podium-2 .tl-podium-avatar {
      border-color: var(--silver);
      box-shadow: 0 0 0 3px rgba(192, 192, 192, 0.2), 0 0 16px 2px rgba(192, 192, 192, 0.55);
      animation: tl-glow-silver 1.8s ease-in-out infinite;
    }
    .tl-podium-3 .tl-podium-avatar {
      border-color: var(--bronze);
      box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.2), 0 0 16px 2px rgba(205, 127, 50, 0.55);
      animation: tl-glow-bronze 2s ease-in-out infinite;
    }
    @keyframes tl-glow-gold {
      0%, 100% { box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.25), 0 0 24px 4px rgba(255, 209, 102, 0.65); }
      50% { box-shadow: 0 0 0 6px rgba(255, 209, 102, 0.4), 0 0 34px 8px rgba(255, 209, 102, 0.9); }
    }
    @keyframes tl-glow-silver {
      0%, 100% { box-shadow: 0 0 0 3px rgba(192, 192, 192, 0.2), 0 0 16px 2px rgba(192, 192, 192, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(192, 192, 192, 0.35), 0 0 24px 5px rgba(192, 192, 192, 0.8); }
    }
    @keyframes tl-glow-bronze {
      0%, 100% { box-shadow: 0 0 0 3px rgba(205, 127, 50, 0.2), 0 0 16px 2px rgba(205, 127, 50, 0.55); }
      50% { box-shadow: 0 0 0 5px rgba(205, 127, 50, 0.35), 0 0 24px 5px rgba(205, 127, 50, 0.8); }
    }
    .tl-podium-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .tl-podium-name {
      font-weight: 700;
      font-size: 13px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tl-podium-1 .tl-podium-name { font-size: 16px; color: var(--gold); font-weight: 800; }
    .tl-podium-score { font-size: 12px; color: var(--gold); font-weight: 700; }
    .tl-podium-1 .tl-podium-score { font-size: 15px; }
    .tl-podium-stand {
      margin-top: 6px;
      width: 100%;
      border-radius: 6px 6px 0 0;
      text-align: center;
      font-weight: 800;
      color: #12151c;
      padding-top: 4px;
      position: relative;
      overflow: hidden;
    }
    .tl-podium-stand::after {
      content: '';
      position: absolute;
      top: 0; left: -60%;
      width: 40%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: tl-stand-shine 2.6s ease-in-out infinite;
    }
    @keyframes tl-stand-shine {
      0% { left: -60%; }
      50% { left: 130%; }
      100% { left: 130%; }
    }
    .tl-podium-1 .tl-podium-stand { height: 66px; background: linear-gradient(180deg, #ffe08a, var(--gold), #b8860b); font-size: 24px; box-shadow: 0 -2px 20px rgba(255, 209, 102, 0.5); }
    .tl-podium-2 .tl-podium-stand { height: 46px; background: linear-gradient(180deg, #e6e6e6, var(--silver), #8a8f98); font-size: 19px; }
    .tl-podium-3 .tl-podium-stand { height: 34px; background: linear-gradient(180deg, #e0a868, var(--bronze), #7a4a26); font-size: 17px; }

    /* Celebration effects (fireworks / confetti / badges / cheer squad / name callout) */
    .fireworks-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .firework-particle { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; box-shadow: 0 0 6px currentColor; }
    .confetti-piece {
      position: absolute; top: -8%; width: 8px; height: 14px; pointer-events: none;
      border-radius: 2px;
    }
    .champion-badge {
      position: absolute; left: 50%; top: 22%; pointer-events: none;
      text-shadow: 0 0 30px rgba(255, 209, 102, 0.9);
      z-index: 2;
    }
    .cheer-emoji { position: absolute; bottom: 8%; font-size: 24px; pointer-events: none; }
    .name-callout {
      position: absolute; left: 50%; top: 42%; pointer-events: none;
      font-weight: 800; white-space: nowrap; color: var(--text);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8), 0 0 16px rgba(255, 209, 102, 0.5);
      font-size: 18px;
      z-index: 2;
    }
    .name-callout.podium { font-size: 20px; color: var(--gold); }
    .name-callout.champion {
      font-size: 26px; color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 209, 102, 0.85);
    }
  </style>
</head>
<body>
  <div class="wrap" style="max-width: 500px;">
    <div id="login-screen" class="card" style="max-width: 360px; margin: 60px auto; text-align: center;">
      <h1>🔑 Admin Login</h1>
      <p style="color: var(--muted); font-size: 13px;">This page is for the admin only — it shows the live Tournament top score.</p>
      <input id="password-input" type="password" placeholder="Admin password" autocomplete="off" style="margin: 16px 0;" />
      <button id="login-btn" style="width: 100%;">Log in</button>
      <p id="login-error" class="hidden" style="color: var(--bad); font-size: 13px; margin-top: 10px;">Wrong password.</p>
    </div>
  </div>

  <div id="page-screen" class="tl-wrap hidden">
    <h1>📺 Live Tournament Top Score</h1>
    <div class="tl-grid" id="tl-grid"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="rules.js"></script>
  <script src="common.js"></script>
  <script src="tournament-live.js"></script>
</body>
</html>
