<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Sprint — Autumn Festival</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1>🔢 Sudoku Sprint</h1>
      <div><a href="../index.html">← Hub</a> · <a href="#" id="rules-link">Rules</a></div>
    </div>

    <div id="play-screen">
      <div class="status-bar">
        <div>Time: <b id="timer">0s</b></div>
        <div>Mistakes: <b id="mistakes">0</b></div>
        <div>Time Score: <b id="time-score">300</b></div>
        <div>Input Score: <b id="input-score">0</b></div>
        <div>Attempt: <b id="attempt-info">1/3</b></div>
      </div>
      <div id="board" class="board"></div>
      <div style="text-align:center; margin-top:12px;">
        <button class="danger" id="give-up-btn">🏳️ Give Up</button>
      </div>
    </div>

    <div id="result-screen" class="card result-card hidden">
      <div id="result-title">Solved! 🎉</div>
      <div class="score-big" id="final-score">0</div>
      <div style="color:var(--muted); font-size:13px;" id="result-detail"></div>
      <div class="actions">
        <button id="play-again-btn">Play Again</button>
        <button class="secondary" onclick="window.location.href='../index.html'">Back to Hub</button>
      </div>
    </div>

    <div id="exhausted-screen" class="card result-card hidden">
      <div>🔒 No attempts left</div>
      <div style="color:var(--muted); font-size:13px; margin-top:8px;">
        You've used all 3 of your Sudoku attempts for this event.
      </div>
      <div class="actions">
        <button class="secondary" onclick="window.location.href='../index.html'">Back to Hub</button>
      </div>
    </div>
  </div>

  <div id="rules-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>🔢 Sudoku Sprint</h2>
      <ol id="rules-body"></ol>
      <button class="modal-close secondary">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../rules.js"></script>
  <script src="../common.js"></script>
  <script src="../sudoku-gen.js"></script>
  <script src="sudoku.js"></script>
</body>
</html>
