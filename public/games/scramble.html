<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Scramble — Autumn Festival</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <h1>🍂 Word Scramble</h1>
      <div><a href="../index.html">← Hub</a> · <a href="#" id="rules-link">Rules</a></div>
    </div>

    <div id="play-screen">
      <div class="status-bar">
        <div>Time left: <b id="timer">60s</b></div>
        <div>Score: <b id="live-score">0</b></div>
      </div>
      <div class="scramble-progress">Word <span id="word-index">1</span> of <span id="word-total">12</span></div>
      <div class="card">
        <div class="scramble-word" id="scrambled"></div>
        <div class="scramble-hint" id="hint"></div>
        <div class="scramble-input-row">
          <input type="text" id="answer-input" maxlength="20" autocomplete="off" placeholder="Type your answer" />
          <button id="submit-btn">Submit</button>
        </div>
        <div class="scramble-flash" id="flash"></div>
        <div style="text-align:center; margin-top:10px; display:flex; gap:8px; justify-content:center;">
          <button class="secondary" id="hint-btn">💡 Hint (unlocks in 15s)</button>
          <button class="secondary" id="skip-btn">Skip word</button>
        </div>
      </div>
    </div>

    <div id="result-screen" class="card result-card hidden">
      <div>Time's up! 🍁</div>
      <div class="score-big" id="final-score">0</div>
      <div style="color:var(--muted); font-size:13px;" id="result-detail"></div>
      <div class="actions">
        <button id="play-again-btn">Play Again</button>
        <button class="secondary" onclick="window.location.href='../index.html'">Back to Hub</button>
      </div>
    </div>
  </div>

  <div id="rules-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="rules-lang-toggle">
        <button type="button" class="rules-lang-en">English</button>
        <button type="button" class="rules-lang-vi">Tiếng Việt</button>
      </div>
      <h2>🍂 Word Scramble</h2>
      <ol id="rules-body"></ol>
      <button class="modal-close secondary">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../rules.js"></script>
  <script src="../common.js"></script>
  <script src="scramble.js"></script>
</body>
</html>
