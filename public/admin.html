<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Autumn Festival Tournament</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap" style="max-width: 720px;">
    <div id="login-screen" class="card" style="max-width: 360px; margin: 60px auto; text-align: center;">
      <h1>🔑 Admin Login</h1>
      <input id="password-input" type="password" placeholder="Admin password" autocomplete="off" style="margin: 16px 0;" />
      <button id="login-btn" style="width: 100%;">Log in</button>
      <p id="login-error" class="hidden" style="color: var(--bad); font-size: 13px; margin-top: 10px;">Wrong password.</p>
    </div>

    <div id="panel-screen" class="hidden">
      <div class="top-bar">
        <h1>🔑 Admin Panel</h1>
        <a href="index.html">Hub →</a>
      </div>

      <p class="admin-meta" id="player-count" style="margin-bottom: 16px;"></p>

      <div class="card" style="margin-bottom: 16px; text-align: center;">
        <h3 style="margin-top:0;">🧪 Demo Data</h3>
        <p style="color: var(--muted); font-size: 13px; margin-top: -4px;">Preview the leaderboard with fake players. Never affects real scores.</p>
        <div class="admin-actions">
          <button id="seed-demo-btn" class="secondary">Seed Demo Data</button>
          <button id="clear-demo-btn" class="danger">Clear Demo Data</button>
        </div>
        <p id="demo-status" style="color: var(--muted); font-size: 12px; margin-bottom: 0;"></p>
      </div>

      <div id="game-controls" class="game-grid"></div>

      <div class="card" style="margin-top: 16px;">
        <h3 style="text-align:center; margin-top:0;">🚩 Suspicious Activity</h3>
        <p id="flags-empty" style="color: var(--muted); font-size: 13px; text-align: center;">No flags yet.</p>
        <ul id="flags-list" style="list-style:none; padding:0; margin:0; max-height:260px; overflow-y:auto;"></ul>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="rules.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
